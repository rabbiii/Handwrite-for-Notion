name: Build iPad app

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag, such as v2.0.0 (defaults to build-RUN_NUMBER)'
        required: false
        type: string
        default: ''
  push:
    branches: [main]
    paths:
      - 'PencilNotes.swiftpm/**'
      - 'MacBuild/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'scripts/build_ios_unsigned.sh'
      - 'scripts/generate_xcode_project.py'
      - 'scripts/test_ios.sh'
      - 'scripts/select_xcode.sh'
      - '.github/workflows/build-ios.yml'

permissions:
  contents: read

jobs:
  build:
    name: Test and build native iPad app
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select Xcode with Liquid Glass SDK
        run: bash scripts/select_xcode.sh
      - name: Run portable core tests
        shell: bash
        run: |
          set +e
          swift test --jobs 4 2>&1 | tee /tmp/pencil-core-tests.log
          result=${PIPESTATUS[0]}
          python3 - <<'PY'
          from pathlib import Path
          for line in Path('/tmp/pencil-core-tests.log').read_text().splitlines():
              if 'error:' in line or 'failed -' in line:
                  print('::error::'+line.replace('%','%25'))
          PY
          exit "$result"
      - name: Test drawing, migration, image export, and editor on iPad simulator
        run: bash scripts/test_ios.sh
      - name: Save simulator checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PencilNotes-simulator-checks
          path: |
            .build/ios-tests/build.log
            dist/UI-Previews
          if-no-files-found: ignore
          retention-days: 3
      - name: Compile and package unsigned IPA
        run: bash scripts/build_ios_unsigned.sh
      - name: Save unsigned app for personal sideloading
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PencilNotes-unsigned-iPad
          path: |
            dist/PencilNotes-unsigned.ipa
            dist/PencilNotes-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 3

  release:
    name: Release built IPA
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    concurrency:
      group: ipad-release-${{ inputs.release_tag || format('build-{0}', github.run_number) }}
      cancel-in-progress: false
    steps:
      - name: Check out built commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Publish IPA from build artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || format('build-{0}', github.run_number) }}
        run: |
          set -euo pipefail
          git check-ref-format "refs/tags/$RELEASE_TAG"
          if [[ "$RELEASE_TAG" == -* ]]; then
            echo '::error::Release tags must not begin with a dash.'
            exit 1
          fi
          git fetch origin --tags
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tag_commit=$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo '::error::This tag points to another commit. Choose a new release tag.'
              exit 1
            fi
          fi
          gh run download "$GITHUB_RUN_ID" --name PencilNotes-unsigned-iPad --dir release-assets
          (cd release-assets && sha256sum --check PencilNotes-unsigned.ipa.sha256)
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > /tmp/pencil-release-draft; then
            if [[ "$(cat /tmp/pencil-release-draft)" != true ]]; then
              echo '::error::This release is already published. Choose a new release tag.'
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" \
              --title "PencilNotes $RELEASE_TAG" --generate-notes --draft
          fi
          gh release upload "$RELEASE_TAG" \
            release-assets/PencilNotes-unsigned.ipa release-assets/PencilNotes-unsigned.ipa.sha256 --clobber
          gh release edit "$RELEASE_TAG" --draft=false
